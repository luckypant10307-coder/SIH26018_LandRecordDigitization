<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login - Land Record Digitization System</title>
<link rel="stylesheet" href="styles.css" />
<style>
/* ----------------------------------------------------------------------
   Signing in is the first thing anyone sees, so it has to look like the
   same system as everything behind it.

   This page previously loaded styles.css and then overrode all of it with
   a hardcoded indigo gradient, a white card and slate-grey text - so the
   operator signed in to one product and landed in another. Every colour
   below is a token from styles.css instead, which means the login page
   follows any future theme change with no edit to this file.

   Note what is NOT set: body has no background of its own. That lets the
   application's own surveyed-sheet ground show through, so the parcels
   behind the card are the same ones behind the workspace.
   ---------------------------------------------------------------------- */

body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
}

.login-container {
  background: var(--canvas);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-lift);
  max-width: 420px;
  width: 100%;
  padding: 36px 34px 30px;
  animation: sheet-settle .7s var(--ease) both;
}

.login-header { text-align: center; margin-bottom: 26px; }

/* The same green mark the application header carries, at the same weight. */
.login-header .brand-mark {
  width: 56px;
  height: 56px;
  background: linear-gradient(145deg, var(--green) 0%, var(--green-edge) 100%);
  color: #06140D;
  border-radius: var(--r-lg);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  font-weight: 700;
  margin-bottom: 16px;
  box-shadow: 0 6px 18px rgba(79, 201, 138, .22);
}

.login-header h1 {
  font-size: 21px;
  margin: 0 0 7px;
  color: var(--text);
  letter-spacing: -.01em;
}

.login-header p {
  margin: 0 auto;
  max-width: 30ch;
  color: var(--text-2);
  font-size: 13px;
  line-height: 1.45;
}

.form-group { margin-bottom: 17px; }

.form-group label {
  display: block;
  margin-bottom: 7px;
  font-weight: 600;
  color: var(--text);
  font-size: 13px;
}

.form-group input,
.form-group select {
  width: 100%;
  padding: 11px 14px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  transition: border-color .18s var(--ease), box-shadow .18s var(--ease);
}

.form-group input::placeholder { color: var(--text-2); }

.form-group input:focus,
.form-group select:focus {
  outline: none;
  border-color: var(--green);
  box-shadow: 0 0 0 3px var(--green-soft);
}

.form-group select { cursor: pointer; }

/* Green is this system's action colour everywhere else; the sign-in button
   is the same action, so it is the same green rather than a second accent. */
.btn-primary {
  width: 100%;
  padding: 12px;
  margin-top: 4px;
  background: var(--green);
  color: #06140D;
  border: none;
  border-radius: var(--r);
  font-size: 15px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: transform .18s var(--ease), box-shadow .18s var(--ease),
              background .18s var(--ease);
}

.btn-primary:hover:not(:disabled) {
  background: var(--green-deep);
  transform: translateY(-1px);
  box-shadow: 0 8px 22px rgba(79, 201, 138, .26);
}

.btn-primary:active:not(:disabled) { transform: translateY(0); }

.btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }

.toggle-form {
  text-align: center;
  margin-top: 20px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
  color: var(--text-2);
  font-size: 13px;
}

.toggle-form a,
.forgot-password a {
  color: var(--blue-text);
  text-decoration: none;
  font-weight: 600;
  cursor: pointer;
}

.toggle-form a:hover,
.forgot-password a:hover { text-decoration: underline; }

.forgot-password { text-align: right; margin-top: 8px; }
.forgot-password a { font-weight: 500; font-size: 12px; }

/* Status messages reuse the palette's reserved signal colours, so red and
   green mean the same thing here as they do on a validation finding. */
.alert {
  padding: 11px 14px;
  border-radius: var(--r);
  margin-bottom: 18px;
  font-size: 13px;
  line-height: 1.45;
}

.alert-error {
  background: var(--red-soft);
  color: var(--red-text);
  border: 1px solid var(--red-edge);
}

.alert-success {
  background: var(--green-soft);
  color: var(--green-text);
  border: 1px solid var(--green-edge);
}

#signupForm { display: none; }

@media (max-width: 460px) {
  .login-container { padding: 28px 22px 24px; }
}
</style>
</head>
<body>

<div class="login-container">
  <div class="login-header">
    <div class="brand-mark">भू</div>
    <h1>Land Record System</h1>
    <p>Department of Land Resources · Ministry of Rural Development</p>
  </div>

  <div id="alertBox"></div>

  <!-- Login Form -->
  <form id="loginForm">
    <div class="form-group">
      <label for="loginEmail">Email Address</label>
      <input type="email" id="loginEmail" required placeholder="Enter your email" />
    </div>

    <div class="form-group">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" required placeholder="Enter your password" />
    </div>

    <div class="forgot-password">
      <a href="#" id="forgotPasswordLink">Forgot password?</a>
    </div>

    <div class="form-group" style="margin-top: 24px;">
      <button type="submit" class="btn-primary" id="loginBtn">Sign In</button>
    </div>

    <div class="toggle-form">
      Don't have an account? <a id="showSignup">Sign up</a>
    </div>
  </form>

  <!-- Signup Form -->
  <form id="signupForm">
    <div class="form-group">
      <label for="signupName">Full Name</label>
      <input type="text" id="signupName" required placeholder="Enter your full name" />
    </div>

    <div class="form-group">
      <label for="signupEmail">Email Address</label>
      <input type="email" id="signupEmail" required placeholder="Enter your email" />
    </div>

    <div class="form-group">
      <label for="signupPassword">Password</label>
      <input type="password" id="signupPassword" required placeholder="Create a password (min 6 characters)" minlength="6" />
    </div>

    <div class="form-group">
      <label for="signupRole">Role</label>
      <select id="signupRole" required>
        <option value="">Select your role</option>
        <option value="operator">Operator - Upload & correct documents</option>
        <option value="verifier">Verifier - Review & approve records</option>
        <option value="admin">Admin - Full access including export</option>
        <option value="auditor">Auditor - Read-only audit access</option>
      </select>
    </div>

    <div class="form-group" style="margin-top: 24px;">
      <button type="submit" class="btn-primary" id="signupBtn">Create Account</button>
    </div>

    <div class="toggle-form">
      Already have an account? <a id="showLogin">Sign in</a>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  // Wait for Supabase to load
  let loadAttempts = 0;
  const MAX_ATTEMPTS = 50; // 5 seconds max

  function initAuth() {
    loadAttempts++;

    if (typeof window.supabase === 'undefined') {
      if (loadAttempts < MAX_ATTEMPTS) {
        console.log('Waiting for Supabase to load... Attempt:', loadAttempts);
        setTimeout(initAuth, 100);
        return;
      } else {
        // Failed to load after 5 seconds
        console.error('Supabase library failed to load from CDN');
        document.getElementById('alertBox').innerHTML =
          '<div class="alert alert-error">Failed to load authentication library. Please check your internet connection and refresh the page.</div>';
        return;
      }
    }

    console.log('Supabase loaded successfully');

    // Initialize Supabase client
    if (typeof window.initSupabase === 'function') {
      const initialized = window.initSupabase();
      if (!initialized) {
        console.error('Failed to initialize Supabase client');
        document.getElementById('alertBox').innerHTML =
          '<div class="alert alert-error">Failed to initialize authentication. Please refresh the page.</div>';
        return;
      }
    }

    setupAuthHandlers();
  }

  function setupAuthHandlers() {
  const loginForm = document.getElementById('loginForm');
  const signupForm = document.getElementById('signupForm');
  const alertBox = document.getElementById('alertBox');

  // Toggle between login and signup
  document.getElementById('showSignup').addEventListener('click', (e) => {
    e.preventDefault();
    loginForm.style.display = 'none';
    signupForm.style.display = 'block';
    alertBox.innerHTML = '';
  });

  document.getElementById('showLogin').addEventListener('click', (e) => {
    e.preventDefault();
    signupForm.style.display = 'none';
    loginForm.style.display = 'block';
    alertBox.innerHTML = '';
  });

  // Show alert
  function showAlert(message, type = 'error') {
    alertBox.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
    setTimeout(() => {
      alertBox.innerHTML = '';
    }, 5000);
  }

  // Check if already logged in
  async function checkAuth() {
    try {
      const session = await SupabaseAuth.getSession();
      if (session) {
        window.location.href = 'index.html';
      }
    } catch (error) {
      console.error('Auth check error:', error);
    }
  }

  // Login handler
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    const loginBtn = document.getElementById('loginBtn');

    // Check if SupabaseAuth is available
    if (typeof window.SupabaseAuth === 'undefined') {
      showAlert('Authentication service not loaded. Please refresh the page.');
      return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = 'Signing in...';

    try {
      const { user, session } = await SupabaseAuth.signIn(email, password);

      // Store session info
      localStorage.setItem('supabase_user', JSON.stringify(user));
      localStorage.setItem('user_email', email);
      localStorage.setItem('user_role', user.user_metadata?.role || 'operator');

      showAlert('Login successful! Redirecting...', 'success');
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1000);

    } catch (error) {
      console.error('Login error:', error);
      showAlert(error.message || 'Login failed. Please check your credentials.');
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign In';
    }
  });

  // Signup handler
  signupForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const name = document.getElementById('signupName').value;
    const email = document.getElementById('signupEmail').value;
    const password = document.getElementById('signupPassword').value;
    const role = document.getElementById('signupRole').value;
    const signupBtn = document.getElementById('signupBtn');

    if (!role) {
      showAlert('Please select a role');
      return;
    }

    // Check if SupabaseAuth is available
    if (typeof window.SupabaseAuth === 'undefined') {
      showAlert('Authentication service not loaded. Please refresh the page.');
      return;
    }

    signupBtn.disabled = true;
    signupBtn.textContent = 'Creating account...';

    try {
      await SupabaseAuth.signUp(email, password, {
        full_name: name,
        role: role
      });

      showAlert('Account created successfully! Please check your email to verify your account.', 'success');

      // Switch to login form after 3 seconds
      setTimeout(() => {
        signupForm.style.display = 'none';
        loginForm.style.display = 'block';
        signupForm.reset();
      }, 3000);

    } catch (error) {
      console.error('Signup error:', error);
      showAlert(error.message || 'Signup failed. Please try again.');
    } finally {
      signupBtn.disabled = false;
      signupBtn.textContent = 'Create Account';
    }
  });

  // Forgot password handler
  document.getElementById('forgotPasswordLink').addEventListener('click', async (e) => {
    e.preventDefault();

    const email = document.getElementById('loginEmail').value;

    if (!email) {
      showAlert('Please enter your email address first');
      return;
    }

    try {
      await SupabaseAuth.resetPassword(email);
      showAlert('Password reset email sent! Please check your inbox.', 'success');
    } catch (error) {
      showAlert(error.message || 'Failed to send reset email');
    }
  });

  // Check auth on load
  checkAuth();
  }

  // Start initialization when page loads
  initAuth();
</script>

</body>
</html>
